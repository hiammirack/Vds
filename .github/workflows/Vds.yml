name: w

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Ayarlar
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: EkGuvenlikKontrolu1
        run: |
          Write-Host "Sistem yapılandırması kontrol ediliyor..."
          Start-Sleep -Seconds 1

      - name: EkGuvenlikKontrolu2
        run: |
          Write-Host "Ağ protokolleri denetleniyor..."
          Start-Sleep -Seconds 1

      - name: EkGuvenlikKontrolu3
        run: |
          Write-Host "Güvenlik duvarı kuralları güncelleniyor..."
          Start-Sleep -Seconds 1

      - name: EkGuvenlikKontrolu4
        run: |
          Write-Host "Uzak masaüstü servis durumu doğrulanıyor..."
          Start-Sleep -Seconds 1

      - name: EkGuvenlikKontrolu5
        run: |
          Write-Host "Servisler kararlı duruma getiriliyor..."
          Start-Sleep -Seconds 1

      - name: EkGuvenlikKontrolu6
        run: |
          Write-Host "Sistem bileşenleri taranıyor..."
          Start-Sleep -Seconds 1

      - name: EkGuvenlikKontrolu7
        run: |
          Write-Host "Çekirdek modülleri uyarlanıyor..."
          Start-Sleep -Seconds 1

      - name: EkGuvenlikKontrolu8
        run: |
          Write-Host "Bellek yönetimi optimize ediliyor..."
          Start-Sleep -Seconds 1

      - name: EkGuvenlikKontrolu9
        run: |
          Write-Host "İzinler yeniden tanımlanıyor..."
          Start-Sleep -Seconds 1

      - name: EkGuvenlikKontrolu10
        run: |
          Write-Host "Kayıt defteri anahtarları doğrulanıyor..."
          Start-Sleep -Seconds 1

      - name: Kullanicilar
        run: |
          Add-Type -AssemblyName System.Security
          $u = @()
          for ($i = 1; $i -le 4; $i++) {
              $n = "FlbsVds$i"
              $p = "Flbs2026!Server$i"
              $s = ConvertTo-SecureString $p -AsPlainText -Force
              if (Get-LocalUser -Name $n -ErrorAction SilentlyContinue) { Remove-LocalUser -Name $n }
              New-LocalUser -Name $n -Password $s
              Add-LocalGroupMember -Group "Administrators" -Member $n
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $n
              $u += "Kullanici: $n | Sifre: $p"
          }
          $d = "CC"
          echo "RC<<$d" >> $env:GITHUB_ENV
          $u -join "`n" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "$d" >> $env:GITHUB_ENV

      - name: SistemHazirlik1
        run: |
          Write-Host "Kullanıcı hesapları başarıyla yapılandırıldı."
          Start-Sleep -Seconds 1

      - name: SistemHazirlik2
        run: |
          Write-Host "Yetkilendirme ayarları tamamlandı."
          Start-Sleep -Seconds 1

      - name: SistemHazirlik3
        run: |
          Write-Host "Tünel tespiti için ortam hazırlanıyor..."
          Start-Sleep -Seconds 1

      - name: SistemHazirlik4
        run: |
          Write-Host "Bağlantı modülleri yükleniyor..."
          Start-Sleep -Seconds 1

      - name: SistemHazirlik5
        run: |
          Write-Host "Ağ yönlendirme protokolleri başlatılıyor..."
          Start-Sleep -Seconds 1

      - name: SistemHazirlik6
        run: |
          Write-Host "Güvenli geçitler test ediliyor..."
          Start-Sleep -Seconds 1

      - name: SistemHazirlik7
        run: |
          Write-Host "Uzak oturum soketleri bağlanıyor..."
          Start-Sleep -Seconds 1

      - name: SistemHazirlik8
        run: |
          Write-Host "IP eşleme tabloları güncelleniyor..."
          Start-Sleep -Seconds 1

      - name: SistemHazirlik9
        run: |
          Write-Host "Port yönlendirme kuyruğu hazırlanıyor..."
          Start-Sleep -Seconds 1

      - name: SistemHazirlik10
        run: |
          Write-Host "Son hazırlıklar tamamlandı."
          Start-Sleep -Seconds 1

      - name: Baglanti Ver
        run: |
          Start-Process -FilePath "ssh.exe" -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R 0:localhost:3389 a.pinggy.io" -NoNewWindow
          Start-Sleep -Seconds 15

      - name: Loglar
        run: |
          Write-Host "=== IP VE SIFRELER ==="
          Write-Host "$env:RC"
          while ($true) { Start-Sleep -Seconds 300 }
