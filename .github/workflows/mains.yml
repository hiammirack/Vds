name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          $rule = Get-NetFirewallRule -Name "RDP-External" -ErrorAction SilentlyContinue
          if ($rule) {
              netsh advfirewall firewall delete rule name="RDP-External"
          }
          netsh advfirewall firewall add rule name="RDP-External" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create Multiple FlbsVds Users
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }

          $allCreds = @()

          for ($i = 1; $i -le 4; $i++) {
              $username = "FlbsVds$i"
              
              $rawPassword = @()
              $rawPassword += $charSet.Upper | Get-Random -Count 4
              $rawPassword += $charSet.Lower | Get-Random -Count 4
              $rawPassword += $charSet.Number | Get-Random -Count 4
              $rawPassword += $charSet.Special | Get-Random -Count 4
              $password = -join ($rawPassword | Sort-Object { Get-Random })
              $securePass = ConvertTo-SecureString $password -AsPlainText -Force
              
              if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
                  Remove-LocalUser -Name $username
              }

              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $username
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

              $allCreds += "Kullanici: $username | Sifre: $password"
          }

          $delimiter = "EOF_CREDENTIALS"
          echo "RDP_CREDS<<$delimiter" >> $env:GITHUB_ENV
          $allCreds -join "`n" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "$delimiter" >> $env:GITHUB_ENV

      - name: Setup Ngrok Tunnel
        run: |
          # Ngrok'u indir ve kur
          winget install --id Ngrok.Ngrok -e --silent
          
          # Ngrok Auth Token'ı GitHub Secrets'tan alıyoruz (Kendi ngrok token'ını secrets kısmına NGROK_AUTH_TOKEN adıyla eklemelisin)
          & "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\Ngrok.Ngrok_Microsoft.Winget.Source_8wekyb3d8bbwe\ngrok.exe" config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          
          # Arka planda TCP tüneli başlat (Port 3389)
          Start-Process -FilePath "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\Ngrok.Ngrok_Microsoft.Winget.Source_8wekyb3d8bbwe\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
          
          # Ngrok'un tünel adresini alabilmesi için biraz bekleyelim
          Start-Sleep -Seconds 5

      - name: Get Ngrok Connection Address
        run: |
          try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
              $tunnel = $response.tunnels | Where-Object { $_.proto -eq "tcp" }
              $publicUrl = $tunnel.public_url # tcp://0.tcp.ngrok.io:12345 formatında gelir
              
              Write-Host "Ngrok URL: $publicUrl"
              echo "NGROK_URL=$publicUrl" >> $env:GITHUB_ENV
          } catch {
              Write-Warning "Ngrok adresi otomatik alinamadi. Ngrok API henuz hazir degil."
          }

      - name: Maintain Connection
        run: |
          Write-Host "`n=== HERkESE ACIK RDP EKRANI ==="
          Write-Host "Baglanti Adresi (Ngrok): $env:NGROK_URL"
          Write-Host "---------------------------------"
          Write-Host "$env:RDP_CREDS"
          Write-Host "=================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] VDS Havuzu Aktif ve Disaridan Erisilebilir"
              Start-Sleep -Seconds 300
          }
