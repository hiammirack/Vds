name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings and Optimize Performance
        run: |
          Write-Host "Uzak Masaustu servisleri yapilandiriliyor..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          $rule = Get-NetFirewallRule -Name "RDP-External" -ErrorAction SilentlyContinue
          if ($rule) {
              netsh advfirewall firewall delete rule name="RDP-External"
          }
          netsh advfirewall firewall add rule name="RDP-External" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force
          Write-Host "RDP ayarlari basariyla tamamlandi."

      - name: Create Multiple FlbsVds Users with Advanced Security
        run: |
          Write-Host "Coklu kullanici havuzu olusturuluyor..."
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }

          $allCreds = @()

          for ($i = 1; $i -le 4; $i++) {
              $username = "FlbsVds$i"
              
              $rawPassword = @()
              $rawPassword += $charSet.Upper | Get-Random -Count 4
              $rawPassword += $charSet.Lower | Get-Random -Count 4
              $rawPassword += $charSet.Number | Get-Random -Count 4
              $rawPassword += $charSet.Special | Get-Random -Count 4
              $password = -join ($rawPassword | Sort-Object { Get-Random })
              $securePass = ConvertTo-SecureString $password -AsPlainText -Force
              
              if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
                  Remove-LocalUser -Name $username
              }

              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $username
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

              $allCreds += "Kullanici: $username | Sifre: $password"
          }

          $delimiter = "EOF_CREDENTIALS"
          echo "RDP_CREDS<<$delimiter" >> $env:GITHUB_ENV
          $allCreds -join "`n" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "$delimiter" >> $env:GITHUB_ENV
          Write-Host "Tum kullanicilar basariyla tanimlandi."

      - name: Initialize Network Tunneling Services
        run: |
          Write-Host "Harici erisim icin tunelleme baslatiliyor..."
          Start-Process -FilePath "ssh.exe" -ArgumentList "-o StrictHostKeyChecking=no -p 80 tcp://a.pinggy.io:0:localhost:3389" -NoNewWindow
          Start-Sleep -Seconds 10
          Write-Host "Tunelleme aktif hale getirildi."

      - name: Display Connection Details and Maintain Pool
        run: |
          Write-Host "`n================================="
          Write-Host "=== HERKESE ACIK RDP EKRANI ==="
          Write-Host "Loglar arasindaki 'tcp://...' adresini kopyalayip Uzak Masaustune yazabilirsiniz."
          Write-Host "---------------------------------"
          Write-Host "$env:RDP_CREDS"
          Write-Host "=================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] VDS Havuzu Aktif ve Disaridan Erisilebilir durumda calismaya devam ediyor..."
              Start-Sleep -Seconds 300
          }
